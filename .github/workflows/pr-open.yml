name: Build Pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Node 22 build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npx --yes pnpm@7.33.7 install --frozen-lockfile
      - name: Build with local content
        run: node_modules/.bin/tinacms dev -c 'node_modules/.bin/next build'
